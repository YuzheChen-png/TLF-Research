name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
  run: |
    # 如果仓库根目录有 manage.py，直接运行；否则查找第一级子目录下的 manage.py 并运行第一个找到的
    if [ -f manage.py ]; then
      echo "Using ./manage.py"
      python manage.py test
    else
      mg=$(find . -maxdepth 4 -type f -name manage.py | head -n 1)
      if [ -z "$mg" ]; then
        echo "Error: manage.py not found in repo (searched up to depth 4)"
        ls -la
        ls -laR | sed -n '1,200p'
        exit 1
      fi
      echo "Found manage.py at: $mg"
      python "$mg" test
    fi
